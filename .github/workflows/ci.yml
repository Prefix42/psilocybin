name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package with dev extras
        run: pip install -e ".[dev]"

      - name: Run tests with coverage
        run: pytest --cov=psilocybin --cov-report=xml --cov-report=term-missing

      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 7

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: ruff check
        run: ruff check .
      - name: ruff format --check
        run: ruff format --check .

  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: mypy src

  complexity:
    name: Code smell (radon + xenon)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Cyclomatic complexity report
        run: radon cc src -a -s
      - name: Maintainability index report
        run: radon mi src -s
      - name: Fail build on excessive complexity
        run: xenon --max-absolute B --max-modules A --max-average A src

  security:
    name: Security scan (bandit + pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Bandit static security analysis
        run: bandit -c pyproject.toml -r src
      - name: pip-audit dependency vulnerability scan
        run: pip-audit

  secrets:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: set GITLEAKS_LICENSE in repo secrets if you're on an
          # org account; not required for public repos.

  version-bump:
    name: Version bump required for src/ or runtime-dependency changes
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require a pyproject.toml version bump when it matters
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"

          SRC_CHANGED=false
          if git diff --name-only "$BASE"...HEAD -- src/ | grep -q .; then
            SRC_CHANGED=true
          fi

          OLD_DEPS=$(git show "$BASE:pyproject.toml" | grep -E '^(dependencies|requires-python) = ')
          NEW_DEPS=$(grep -E '^(dependencies|requires-python) = ' pyproject.toml)
          DEPS_CHANGED=false
          if [ "$OLD_DEPS" != "$NEW_DEPS" ]; then
            DEPS_CHANGED=true
          fi

          # Dev-only extras and tool config (ruff/mypy/bandit/etc.) deliberately
          # don't count here - they never affect what `pip install psilocybin`
          # actually installs, so requiring a version bump for those would just
          # block routine dependency-bot PRs for no user-facing reason.
          if [ "$SRC_CHANGED" = "true" ] || [ "$DEPS_CHANGED" = "true" ]; then
            OLD_VERSION=$(git show "$BASE:pyproject.toml" | grep -m1 '^version = ')
            NEW_VERSION=$(grep -m1 '^version = ' pyproject.toml)
            if [ "$OLD_VERSION" = "$NEW_VERSION" ]; then
              REASON="src/ changed"
              if [ "$SRC_CHANGED" = "true" ] && [ "$DEPS_CHANGED" = "true" ]; then
                REASON="src/ and runtime dependencies changed"
              elif [ "$DEPS_CHANGED" = "true" ]; then
                REASON="runtime dependencies (dependencies/requires-python) changed"
              fi
              echo "::error::$REASON in this PR but pyproject.toml's version was not bumped ($NEW_VERSION). Bump the version to merge."
              exit 1
            fi
            echo "Version bumped: $OLD_VERSION -> $NEW_VERSION"
          else
            echo "No src/ or runtime-dependency changes in this PR - version bump not required."
          fi

  all-checks:
    name: All checks passed
    if: always()
    needs: [test, lint, typecheck, complexity, security, secrets, version-bump]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any dependency job failed
        run: |
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ]; then
            echo "One or more checks failed."
            exit 1
          fi
