name: Publish

# No `release: types: [published]` trigger here - a GitHub Release
# created by release.yml uses the automatic GITHUB_TOKEN, and GitHub
# deliberately does not let events triggered by GITHUB_TOKEN start other
# workflow runs (anti-recursion safeguard), so that trigger would never
# actually fire. release.yml builds and verifies the distribution itself
# as a follow-up job instead of relying on this workflow being triggered
# by its own release. This workflow is now reachable only by manual
# workflow_dispatch, for an ad hoc publish outside the normal release
# flow.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Where to publish"
        type: choice
        options: [testpypi, pypi]
        default: testpypi

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: pip install build

      - name: Build sdist and wheel
        run: python -m build

      - name: Verify metadata (twine check)
        run: |
          pip install twine
          twine check dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish-testpypi:
    name: Publish to TestPyPI
    # TEMPORARILY DISABLED while the version-bump/release-automation system
    # (see AGENTS.md's Versioning section, and release.yml) is being worked
    # out. Restore the line below to re-enable - this is the user's call,
    # not something to flip back on unilaterally:
    #   if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    if: false
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/psylocybin
    permissions:
      id-token: write # required for PyPI trusted publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish to PyPI
    # TEMPORARILY DISABLED - see publish-testpypi above for context. Restore
    # the line below to re-enable, at the user's discretion:
    #   if: github.event_name == 'workflow_dispatch' && inputs.target == 'pypi'
    if: false
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/psylocybin
    permissions:
      id-token: write # required for PyPI trusted publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
